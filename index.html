<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>ระบบลง–คืนรถบริษัท</title>
<script>
  // ตั้งค่าโหมดมืด/สว่างก่อนวาดหน้าเว็บ กันจอกะพริบตอนโหลด
  (function() {
    var stored = localStorage.getItem('theme');
    var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7F2;
    --panel:#FFFFFF;
    --panel-2:#F1F2EC;
    --border:#E3E6DC;
    --text:#1C2321;
    --muted:#69726C;
    --available:#0E8F6F;
    --inuse:#D64545;
    --warn:#C2650B;
    --accent:#FF6B35;
  }
  [data-theme="dark"]{
    --bg:#14181A;
    --panel:#1D2224;
    --panel-2:#252B2D;
    --border:#343B3D;
    --text:#EDEFEA;
    --muted:#96A099;
    --available:#33C795;
    --inuse:#F2665F;
    --warn:#E08A3C;
    --accent:#FF7A47;
  }
  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Thai', sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background-color .2s ease, color .2s ease;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em; }
  button, input, select, textarea{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  header{
    padding:20px 20px 16px;
    display:flex; align-items:center; gap:10px;
  }
  header .header-icon{
    width:34px; height:34px; border-radius:9px; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  header .header-icon svg{ width:19px; height:19px; }
  header h1{ font-size:17px; font-weight:700; margin:0; letter-spacing:0.01em; }
  header p{ margin:1px 0 0; font-size:12px; color:var(--muted); }

  .theme-toggle{
    margin-left:auto; width:40px; height:40px; border-radius:12px;
    border:1px solid var(--border); background:var(--panel-2); color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
  }
  .theme-toggle svg{ width:19px; height:19px; }
  .theme-toggle .icon-sun{ display:none; }
  [data-theme="dark"] .theme-toggle .icon-moon{ display:none; }
  [data-theme="dark"] .theme-toggle .icon-sun{ display:block; }

  nav{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; background:var(--panel); border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(28,35,33,0.06);
  }
  nav button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--muted);
    font-family:inherit; font-size:11px; padding:8px 4px;
    cursor:pointer; border-radius:10px;
  }
  nav button svg{ width:21px; height:21px; }
  nav button.active{ color:var(--accent); }

  main{ padding:14px 16px 96px; max-width:760px; margin:0 auto; }
  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:14px;
  }
  .panel h2{ font-size:14px; color:var(--text); margin:0 0 12px; font-weight:600; }

  .board-row{
    display:grid; grid-template-columns:14px 1fr auto; gap:12px;
    align-items:center; padding:14px 10px; border-bottom:1px solid var(--border);
    border-left:4px solid transparent; margin-left:-10px; padding-left:14px;
  }
  .board-row:last-child{ border-bottom:none; }
  .board-row:has(.dot.available){ border-left-color:var(--available); }
  .board-row:has(.dot.inuse){ border-left-color:var(--inuse); }
  .dot{ width:11px; height:11px; border-radius:50%; margin-top:3px; }
  .dot.available{ background:var(--available); }
  .dot.inuse{ background:var(--inuse); animation:pulse 1.8s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .plate{ font-size:16px; font-weight:600; }
  .meta{ font-size:13px; color:var(--muted); margin-top:4px; line-height:1.6; }
  .meta b{ color:var(--text); font-weight:500; }
  .status-tag{
    font-size:12px; font-weight:600; text-align:center; white-space:nowrap;
    padding:5px 12px; border-radius:999px; color:#fff;
  }
  .status-tag.available{ background:var(--available); }
  .status-tag.inuse{ background:var(--inuse); }

  label{ display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  label:first-child{ margin-top:0; }
  input, select, textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:13px 14px; font-size:15px; min-height:48px;
  }
  textarea{ resize:vertical; min-height:64px; }
  input[type="file"]{ padding:11px 12px; min-height:auto; }

  .radio-group{ display:flex; gap:10px; }
  .radio-option{
    flex:1; display:flex; align-items:center; gap:8px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:10px;
    padding:13px 14px; cursor:pointer; font-size:14px; min-height:48px;
  }
  .radio-option input{ width:auto; margin:0; min-height:auto; accent-color:var(--accent); }
  .radio-option.checked{ border-color:var(--accent); background:rgba(255,107,53,0.06); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:14px 16px; font-size:15px; font-weight:600; min-height:48px;
    cursor:pointer; width:100%; margin-top:8px; transition:transform 0.1s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn.secondary{ background:var(--panel-2); border:1px solid var(--border); color:var(--text); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .photo-preview{
    margin-top:10px; border-radius:10px; overflow:hidden; border:1px solid var(--border);
    max-height:220px; display:none;
  }
  .photo-preview img{ width:100%; display:block; }

  .msg{ font-size:13px; padding:11px 13px; border-radius:10px; margin-top:12px; display:none; font-weight:500; }
  .msg.ok{ background:rgba(14,143,111,0.1); color:var(--available); display:block; }
  .msg.err{ background:rgba(214,69,69,0.1); color:var(--inuse); display:block; }

  .empty{ color:var(--muted); font-size:13px; text-align:center; padding:24px 0; }
  .loading{ color:var(--muted); font-size:13px; text-align:center; padding:24px 0; }

  .distance-result{ text-align:center; padding:18px 0 6px; }
  .distance-result .num{ font-size:38px; font-weight:700; font-family:'IBM Plex Mono', monospace; color:var(--available); }
  .distance-result .unit{ color:var(--muted); font-size:13px; margin-top:4px; }

  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-title{ font-size:14px; font-weight:600; }
  .cal-nav{ width:38px; height:38px; padding:0; margin:0; font-size:17px; flex:none; min-height:auto; }
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px; }
  .cal-weekdays div{ text-align:center; font-size:11px; color:var(--muted); padding:4px 0; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-day{
    min-height:60px; background:var(--panel-2); border:1px solid var(--border); border-radius:8px;
    padding:4px; cursor:pointer; overflow:hidden;
  }
  .cal-day.other-month{ opacity:0.4; }
  .cal-day.today{ border-color:var(--accent); border-width:2px; }
  .cal-day.selected{ border-color:var(--accent); background:rgba(255,107,53,0.08); }
  .cal-day .cal-daynum{ font-size:11px; color:var(--muted); font-family:'IBM Plex Mono', monospace; }
  .cal-day .cal-chip{
    font-size:9px; background:rgba(14,143,111,0.15); color:var(--available);
    border-radius:4px; padding:1px 4px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cal-day .cal-more{ font-size:9px; color:var(--muted); margin-top:2px; }

  .vfleet-hero{
    display:flex; align-items:stretch; justify-content:center; gap:0;
    padding:6px 0 26px; text-align:center;
  }
  .vfleet-hero .stat{ flex:1; padding:0 10px; }
  .vfleet-hero .stat .num{ font-size:38px; font-weight:700; font-family:'IBM Plex Mono', monospace; line-height:1; letter-spacing:-0.02em; }
  .vfleet-hero .stat.available .num{ color:var(--available); }
  .vfleet-hero .stat.inuse .num{ color:var(--inuse); }
  .vfleet-hero .stat .label{ font-size:12px; color:var(--muted); margin-top:8px; }
  .vfleet-hero .vdiv{ width:1px; background:var(--border); margin:2px 0; }

  .vgrid{ display:grid; grid-template-columns:1fr; gap:14px; }
  @media(min-width:640px){ .vgrid{ grid-template-columns:1fr 1fr; } }

  .vcard{
    position:relative; overflow:hidden;
    background:var(--panel); border:1px solid var(--border); border-radius:20px;
    padding:20px; cursor:default; transition:transform .15s ease;
  }
  .vcard-pill{
    position:absolute; top:16px; right:16px; font-size:11px; font-weight:700;
    padding:5px 11px; border-radius:999px; color:#fff;
  }
  .vcard-pill.available{ background:var(--available); }
  .vcard-pill.inuse{ background:var(--inuse); }
  .vcard-icon{ margin:4px 0 16px; color:var(--border); }
  .vcard.available .vcard-icon{ color:rgba(14,143,111,0.4); }
  .vcard.inuse .vcard-icon{ color:rgba(214,69,69,0.4); }
  .vcard-icon svg{ width:96px; height:46px; }
  .vcard-model{ font-size:19px; font-weight:700; letter-spacing:-0.01em; line-height:1.25; }
  .vcard-meta{
    font-size:12.5px; color:var(--muted); margin-top:14px; padding-top:14px;
    border-top:1px solid var(--border); line-height:1.7;
  }
  .vcard-meta b{ color:var(--text); font-weight:600; }
</style>
</head>
<body>

<header>
  <div class="header-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13"/><rect x="3" y="13" width="18" height="5" rx="1.5"/><circle cx="7.5" cy="18" r="1.5"/><circle cx="16.5" cy="18" r="1.5"/></svg>
  </div>
  <div>
    <h1>ระบบลง–คืนรถบริษัท</h1>
    <p>Loxley System Integrator</p>
  </div>
  <button class="theme-toggle" id="theme-toggle" aria-label="สลับโหมดมืด/สว่าง">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5A8.5 8.5 0 1 1 11.5 3 7 7 0 0 0 21 12.5z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
  </button>
</header>

<nav>
  <button data-tab="dashboard" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 1 9-9"/><path d="M12 12l3.2-3.2"/><circle cx="12" cy="12" r="1"/></svg>
    ภาพรวมรถ
  </button>
  <button data-tab="checkout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    ลงใช้รถ
  </button>
  <button data-tab="checkin">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21h4a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-4"/><path d="M8 17l-5-5 5-5"/><path d="M3 12h12"/></svg>
    คืนรถ
  </button>
  <button data-tab="booking">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/></svg>
    จองล่วงหน้า
  </button>
</nav>

<main>

  <!-- DASHBOARD -->
  <section id="tab-dashboard">
    <div id="dash-hero" class="vfleet-hero"><div class="loading">กำลังโหลดข้อมูลรถ...</div></div>
    <div id="dash-list" class="vgrid"></div>
  </section>

  <!-- CHECKOUT -->
  <section id="tab-checkout" style="display:none">
    <div class="panel">
      <h2>ผู้ใช้และรถ</h2>
      <label>ชื่อ - นามสกุล ผู้ใช้รถ</label>
      <select id="co-user"></select>

      <label>รถที่ว่าง</label>
      <select id="co-vehicle"></select>
    </div>

    <div class="panel">
      <h2>รายละเอียดการเดินทาง</h2>
      <label>โปรเจค (JOB)</label>
      <select id="co-project"></select>

      <label>ภารกิจหรือเหตุผลใช้รถ</label>
      <select id="co-purpose"></select>

      <label>สถานที่</label>
      <div class="radio-group" id="co-location-group">
        <label class="radio-option"><input type="radio" name="co-location" value="กรุงเทพมหานคร" checked /> กรุงเทพมหานคร</label>
        <label class="radio-option"><input type="radio" name="co-location" value="ต่างจังหวัด" /> ต่างจังหวัด</label>
      </div>
    </div>

    <div class="panel">
      <h2>ถ่ายรูปเลขไมล์ตอนออก</h2>
      <input id="co-photo" type="file" accept="image/*" capture="environment" />
      <div class="photo-preview" id="co-preview"><img id="co-preview-img" /></div>
      <button class="btn secondary" id="co-ocr-btn" style="margin-top:10px;" disabled>อ่านค่าไมล์จากรูปอัตโนมัติ</button>
      <label>เลขไมล์ (ตรวจสอบ/แก้ไขได้)</label>
      <input id="co-mileage" type="number" inputmode="numeric" placeholder="เช่น 45210" />
      <div class="msg" id="co-msg"></div>
      <button class="btn" id="co-submit">บันทึกลงใช้รถ</button>
    </div>
  </section>

  <!-- CHECKIN -->
  <section id="tab-checkin" style="display:none">
    <div class="panel">
      <h2>เลือกรถที่จะคืน</h2>
      <select id="ci-vehicle"></select>
    </div>

    <div class="panel">
      <h2>ถ่ายรูปเลขไมล์ตอนคืน</h2>
      <input id="ci-photo" type="file" accept="image/*" capture="environment" />
      <div class="photo-preview" id="ci-preview"><img id="ci-preview-img" /></div>
      <button class="btn secondary" id="ci-ocr-btn" style="margin-top:10px;" disabled>อ่านค่าไมล์จากรูปอัตโนมัติ</button>
      <label>เลขไมล์ตอนคืน (ตรวจสอบ/แก้ไขได้)</label>
      <input id="ci-mileage" type="number" inputmode="numeric" placeholder="เช่น 45340" />
      <div class="msg" id="ci-msg"></div>
      <button class="btn" id="ci-submit">บันทึกคืนรถ</button>
      <div class="distance-result" id="ci-result" style="display:none">
        <div class="num" id="ci-distance">—</div>
        <div class="unit">กิโลเมตรที่ใช้ไป</div>
      </div>
    </div>
  </section>

  <!-- BOOKING -->
  <section id="tab-booking" style="display:none">
    <div class="panel">
      <h2>จองรถล่วงหน้า</h2>
      <label>ผู้จอง</label>
      <select id="bk-user"></select>

      <label>เลือกรถ</label>
      <select id="bk-vehicle"></select>

      <label>โปรเจค</label>
      <select id="bk-project"></select>

      <div class="row2">
        <div>
          <label>เริ่มใช้</label>
          <input id="bk-start" type="datetime-local" />
        </div>
        <div>
          <label>ถึง</label>
          <input id="bk-end" type="datetime-local" />
        </div>
      </div>

      <label>หมายเหตุ (ถ้ามี)</label>
      <input id="bk-note" type="text" placeholder="เช่น ไปส่งของที่ไซต์ปทุมธานี" />

      <div class="msg" id="bk-msg"></div>
      <button class="btn" id="bk-submit">บันทึกการจอง</button>
    </div>

    <div class="panel">
      <div class="cal-header">
        <button class="btn secondary cal-nav" id="bk-cal-prev">‹</button>
        <div class="cal-title" id="bk-cal-title">—</div>
        <button class="btn secondary cal-nav" id="bk-cal-next">›</button>
      </div>
      <div class="cal-weekdays">
        <div>อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div>ส</div>
      </div>
      <div class="cal-grid" id="bk-cal-grid"></div>
    </div>

    <div class="panel">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <h2 id="bk-summary" style="margin:0;">คิวจองที่กำลังจะถึง</h2>
        <button class="btn secondary" id="bk-clear-filter" style="display:none; width:auto; padding:6px 10px; font-size:12px; margin:0;">แสดงทั้งหมด</button>
      </div>
      <div id="bk-list"><div class="loading">กำลังโหลด...</div></div>
    </div>
  </section>

</main>

<script>
// ============================================================
// ตั้งค่า: วาง URL ของ Apps Script Web App ที่ deploy แล้วตรงนี้
// ============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbzivcuVqX4WWpUSVlwQYAwqeJrwNG3zFcZVRzs7mfeqfbv7NDAZSOkedY8IkwMaiYYk6w/exec';

// ---------- Theme toggle ----------
document.getElementById('theme-toggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
});

let vehicles = [];
let projects = [];
let users = [];
let purposes = [];
let bookings = [];
let currentTab = 'dashboard';

// ---------- Tabs ----------
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('main > section').forEach(s => s.style.display = 'none');
    document.getElementById('tab-' + btn.dataset.tab).style.display = 'block';
    currentTab = btn.dataset.tab;
    if (currentTab === 'booking') loadBookings(); // โหลดข้อมูลจอง (Calendar) เฉพาะตอนเปิดแท็บนี้เท่านั้น เพื่อให้แท็บอื่นเปิดเร็ว
  });
});

// ---------- Location radio highlight ----------
document.querySelectorAll('#co-location-group input').forEach(r => {
  r.addEventListener('change', () => {
    document.querySelectorAll('#co-location-group .radio-option').forEach(o => o.classList.remove('checked'));
    r.closest('.radio-option').classList.add('checked');
  });
});
document.querySelector('#co-location-group .radio-option').classList.add('checked');

// ---------- Load data ----------
// getData คืนเฉพาะรถ/โปรเจค/ผู้ใช้/ภารกิจ (มี cache ฝั่ง backend ~20 วิ ตอบเร็ว) — ไม่รวมข้อมูลจอง
async function loadData() {
  try {
    const res = await fetch(API_URL + '?action=getData');
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    vehicles = json.vehicles;
    projects = json.projects;
    users = json.users;
    purposes = json.purposes;
    renderDashboard();
    renderCheckoutOptions();
    renderCheckinOptions();
    renderBookingOptions();
  } catch (err) {
    document.getElementById('dash-hero').innerHTML = '';
    document.getElementById('dash-list').innerHTML = '<div class="empty">โหลดข้อมูลไม่สำเร็จ: ' + err.message + '</div>';
  }
}

// bookings ดึงจาก Google Calendar (ช้ากว่า) — โหลดแยกต่างหาก เฉพาะตอนเปิดแท็บ "จองล่วงหน้า"
async function loadBookings() {
  document.getElementById('bk-list').innerHTML = '<div class="loading">กำลังโหลด...</div>';
  try {
    const res = await fetch(API_URL + '?action=getBookings');
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    bookings = json.bookings || [];
    renderCalendarGrid();
    renderBookingList();
  } catch (err) {
    document.getElementById('bk-list').innerHTML = '<div class="empty">โหลดข้อมูลจองไม่สำเร็จ: ' + err.message + '</div>';
  }
}

let calendarViewDate = new Date();
let selectedDay = null; // Date or null

function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function endOfDay(d) { const x = new Date(d); x.setHours(23, 59, 59, 999); return x; }
function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

function renderCalendarGrid() {
  const year = calendarViewDate.getFullYear();
  const month = calendarViewDate.getMonth();
  const monthNames = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  document.getElementById('bk-cal-title').textContent = `${monthNames[month]} ${year + 543}`;

  const firstOfMonth = new Date(year, month, 1);
  const gridStart = new Date(firstOfMonth);
  gridStart.setDate(gridStart.getDate() - firstOfMonth.getDay());

  const today = new Date();
  const grid = document.getElementById('bk-cal-grid');
  let html = '';
  for (let i = 0; i < 42; i++) {
    const cellDate = new Date(gridStart);
    cellDate.setDate(gridStart.getDate() + i);
    const inMonth = cellDate.getMonth() === month;
    const dayBookings = bookings.filter(b =>
      new Date(b['วันเวลาเริ่ม']) <= endOfDay(cellDate) && new Date(b['วันเวลาสิ้นสุด']) >= startOfDay(cellDate)
    );
    const classes = ['cal-day'];
    if (!inMonth) classes.push('other-month');
    if (sameDay(cellDate, today)) classes.push('today');
    if (selectedDay && sameDay(cellDate, selectedDay)) classes.push('selected');

    const chips = dayBookings.slice(0, 2).map(b => `<div class="cal-chip">${b['ทะเบียนรถ']}</div>`).join('');
    const more = dayBookings.length > 2 ? `<div class="cal-more">+${dayBookings.length - 2} เพิ่มเติม</div>` : '';

    html += `<div class="${classes.join(' ')}" onclick="selectCalendarDay('${cellDate.toISOString()}')">
      <div class="cal-daynum">${cellDate.getDate()}</div>
      ${chips}${more}
    </div>`;
  }
  grid.innerHTML = html;
}

function selectCalendarDay(isoDate) {
  const d = new Date(isoDate);
  if (selectedDay && sameDay(d, selectedDay)) {
    selectedDay = null; // กดซ้ำวันเดิม = ยกเลิกการเลือก
  } else {
    selectedDay = d;
  }
  renderCalendarGrid();
  renderBookingList();
}

document.getElementById('bk-cal-prev').addEventListener('click', () => {
  calendarViewDate.setMonth(calendarViewDate.getMonth() - 1);
  renderCalendarGrid();
});
document.getElementById('bk-cal-next').addEventListener('click', () => {
  calendarViewDate.setMonth(calendarViewDate.getMonth() + 1);
  renderCalendarGrid();
});
document.getElementById('bk-clear-filter').addEventListener('click', () => {
  selectedDay = null;
  renderCalendarGrid();
  renderBookingList();
});

function renderBookingOptions() {
  const usel = document.getElementById('bk-user');
  usel.innerHTML = users.map(u => `<option value="${u['ชื่อ-นามสกุล']}">${u['ชื่อ-นามสกุล']}</option>`).join('');

  const vsel = document.getElementById('bk-vehicle');
  vsel.innerHTML = vehicles.map(v => `<option value="${v['VehicleID']}" data-plate="${v['ทะเบียนรถ']}">${v['ทะเบียนรถ']}</option>`).join('');

  const psel = document.getElementById('bk-project');
  psel.innerHTML = projects.map(p => `<option value="${p['ProjectID']}" data-name="${p['ชื่อโปรเจค']}">${p['ชื่อโปรเจค']}</option>`).join('');
}

function renderBookingList() {
  const clearBtn = document.getElementById('bk-clear-filter');
  let shown;
  if (selectedDay) {
    shown = bookings.filter(b => new Date(b['วันเวลาเริ่ม']) <= endOfDay(selectedDay) && new Date(b['วันเวลาสิ้นสุด']) >= startOfDay(selectedDay));
    const d = selectedDay;
    document.getElementById('bk-summary').textContent = `คิวจองวันที่ ${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear() + 543} (${shown.length})`;
    clearBtn.style.display = 'inline-flex';
  } else {
    shown = bookings.filter(b => new Date(b['วันเวลาสิ้นสุด']) >= new Date());
    document.getElementById('bk-summary').textContent = `คิวจองที่กำลังจะถึง (${shown.length})`;
    clearBtn.style.display = 'none';
  }

  const list = document.getElementById('bk-list');
  if (shown.length === 0) {
    list.innerHTML = '<div class="empty">ไม่มีการจองในช่วงนี้</div>';
    return;
  }
  list.innerHTML = shown.map(b => `
    <div class="board-row">
      <div class="dot available"></div>
      <div>
        <div class="plate mono">${b['ทะเบียนรถ']}</div>
        <div class="meta">
          ผู้จอง: <b>${b['ผู้จอง']}</b> · โปรเจค: <b>${b['ชื่อโปรเจค'] || '-'}</b>
          <br>${formatDateTime(new Date(b['วันเวลาเริ่ม']))} — ${formatDateTime(new Date(b['วันเวลาสิ้นสุด']))}
          ${b['หมายเหตุ'] ? `<br>หมายเหตุ: ${b['หมายเหตุ']}` : ''}
        </div>
      </div>
      <button class="btn secondary" style="width:auto; padding:6px 10px; font-size:12px; margin:0;" onclick="cancelBooking('${b['EventID']}')">ยกเลิก</button>
    </div>
  `).join('');
}

async function cancelBooking(eventId) {
  if (!confirm('ยืนยันยกเลิกการจองนี้?')) return;
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'cancelBooking', eventId })
    });
    const json = await res.json();
    if (json.ok) {
      await loadBookings();
    } else {
      alert('ยกเลิกไม่สำเร็จ: ' + json.error);
    }
  } catch (err) {
    alert('เกิดข้อผิดพลาด: ' + err.message);
  }
}

// ---------- Photo helpers ----------
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function wirePhotoInput(inputId, previewBoxId, previewImgId, ocrBtnId) {
  const input = document.getElementById(inputId);
  const box = document.getElementById(previewBoxId);
  const img = document.getElementById(previewImgId);
  const ocrBtn = document.getElementById(ocrBtnId);
  let base64 = null;

  input.addEventListener('change', async () => {
    if (!input.files[0]) return;
    base64 = await fileToBase64(input.files[0]);
    img.src = base64;
    box.style.display = 'block';
    ocrBtn.disabled = false;
  });

  return { getBase64: () => base64 };
}

const coPhoto = wirePhotoInput('co-photo', 'co-preview', 'co-preview-img', 'co-ocr-btn');
const ciPhoto = wirePhotoInput('ci-photo', 'ci-preview', 'ci-preview-img', 'ci-ocr-btn');

async function runOcr(base64, mileageInputId, btn) {
  btn.disabled = true;
  btn.textContent = 'กำลังอ่านค่า...';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'ocr', photoBase64: base64 })
    });
    const json = await res.json();
    if (json.ok && json.detectedMileage) {
      document.getElementById(mileageInputId).value = json.detectedMileage;
    } else {
      alert('อ่านค่าไม่สำเร็จ กรุณากรอกเลขไมล์เอง: ' + (json.error || 'ไม่พบตัวเลขในรูป'));
    }
  } catch (err) {
    alert('เกิดข้อผิดพลาด: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'อ่านค่าไมล์จากรูปอัตโนมัติ';
  }
}

document.getElementById('co-ocr-btn').addEventListener('click', () => {
  const b64 = coPhoto.getBase64();
  if (b64) runOcr(b64, 'co-mileage', document.getElementById('co-ocr-btn'));
});
document.getElementById('ci-ocr-btn').addEventListener('click', () => {
  const b64 = ciPhoto.getBase64();

});
